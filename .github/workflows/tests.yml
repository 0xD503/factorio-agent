# Offline tests on Linux, Windows and macOS with the oldest and newest
# supported Python, and the live selftest on Linux with the free headless
# server. Written before the repository had a remote: not run yet.
name: tests

on:
    push:
    pull_request:

jobs:
    offline:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python: ["3.10", "3.13"]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.python }}
            -   run: python -m unittest discover -s tests -v
            # No game on the runner: this only checks that the CLI starts.
            -   run: python fx.py doctor
                continue-on-error: true

    selftest:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-python@v5
                with:
                    python-version: "3.12"
            -   name: Download the Factorio headless server
                run: |
                    url=https://factorio.com/get-download/stable/headless
                    curl -fsSL -o headless.tar.xz "$url/linux64"
                    mkdir -p "$RUNNER_TEMP/factorio"
                    tar -xJf headless.tar.xz -C "$RUNNER_TEMP/factorio"
            -   run: |
                    python fx.py setup \
                        --server-game "$RUNNER_TEMP/factorio/factorio"
            -   run: python fx.py selftest
