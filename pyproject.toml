[project]
name = "factorio-agent"
version = "0.1.0.dev0"
description = "Let an AI agent play Factorio, solo or in multiplayer."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
fx = "fxa.cli:main"

[tool.setuptools]
packages = ["fxa"]

[tool.ruff]
line-length = 80
target-version = "py310"
extend-include = ["*.fxs"]
extension = {fxs = "python"}
